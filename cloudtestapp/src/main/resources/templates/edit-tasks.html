<!DOCTYPE html>


<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>


<div class="container mt-5">
    <h1>Edit Task</h1>

    <form th:action="@{/tasks/save}" th:object="${task}" method="post">

        <input type="hidden" th:field="*{id}">
        
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" th:field="*{title}" class="form-control" id="title" required>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea th:field="*{description}" class="form-control" id="description" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select th:field="*{status}" class="form-select" id="status">
                <option value="PENDING">Pending</option>
                <option value="IN_PROGRESS">In Progress</option>
                <option value="COMPLETED">Completed</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="dueDate" class="form-label">Due Date</label>
            <input type="date" th:field="*{dueDate}" class="form-control" id="dueDate">
        </div>


        
        <input type="submit" class="btn btn-primary" value="Update Task">

        <div class="d-flex justify-content-end gap-2">
            <a href="/" class="btn btn-secondary">Home</a>
            <a href="/tasks/add" class="btn btn-secondary">Add Task</a>
            <a href="/tasks" class="btn btn-secondary">Tasks</a>
        </div>
    </form>
</div> 




</body>
</html>
