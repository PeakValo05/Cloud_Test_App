<!DOCTYPE html>


<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <title>Cloud Task Manager - Tasks</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/tasks.css}">
</head>


<body>

        <!-- top bar navigation menu -->
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block bg-light sidebar w-100 bg-white shadow-lg">
                <div class="sidebar-sticky align-items-center d-flex">

                    <img th:src="@{/images/GCULOGO.png}"
                             alt="gcu LOGO"
                             class="gcu logo">


                    <ul class="nav flex-row mt-4 ms-auto justify-content-end">
                        <li class="nav-item">
                            <a th:href="@{/}" class="nav-link active text-dark">
                                Home
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/tasks}" class="nav-link text-dark">
                                View Tasks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a th:href="@{/tasks/add}" class="nav-link text-dark">
                                Add Task
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
        
    </div>




    <div class="container mt-5">
        <h1>Task List</h1>


        <a th:href="@{/tasks/add}" class="btn btn-success mb-3">
            Add Task
        </a>

        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Due Date</th>
                    <th>Actions</th>
                </tr>
            </thead>


        <tbody>

        <tr th:each="task : ${tasks}">
            <td th:text="${task.title}"></td>
            <td th:text="${task.description}"></td>
            <td th:text="${task.status}"></td>
            <td th:text="${task.dueDate}"></td>

            <td>
                <a th:href="@{/tasks/edit/{id}(id=${task.id})}"
                    class="btn btn-warning btn-sm">
                     Edit
                </a>
                <!-- Add a delete button with confirmation -->
                <a th:href="@{/tasks/delete/{id}(id=${task.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this task?');">
                    Delete
                </a>
            </td>

        </tr>

        </tbody>
        </table>

        <div class="d-flex justify-content-end gap-2">
        
        <button th:type="button" class="btn btn-secondary" onclick="history.back()">
            Back
        </button>
        <a href="/" class="btn btn-secondary">Home</a>
        </div>
    </div>


</body>
</html>
